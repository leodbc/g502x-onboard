name: New hardware or firmware report
description: Share read-only compatibility evidence for another physical unit, firmware, or transport.
title: "[hardware] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping widen the evidence base.

        **Privacy:** attach only output from `report probe` / `report device`.
        Do **not** paste raw `probe --json`, unit IDs, serial numbers, private fingerprints,
        raw sector dumps, G HUB databases, or personal macros.

        Before upload, run `python g502x.py report check <report.json>`. Raw/private formats fail closed.

        New hardware starts read-only. Do not perform a persistent write on an untested
        transport just to fill out this form.
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: Logitech G502 X LIGHTSPEED
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection path
      options:
        - LIGHTSPEED receiver
        - Wired USB
        - POWERPLAY
        - Other / unknown
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Ubuntu 24.04 / etc.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version and commit
      placeholder: 0.1.0 @ <commit>
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Shareable probe report
      description: Drag and drop the JSON created by `python g502x.py report probe probe-report.json`, or paste its privacy-minimized contents.
      placeholder: Attach the shareable report JSON here.
    validations:
      required: true
  - type: dropdown
    id: reads
    attributes:
      label: Read-only result
      options:
        - Probe/report completed successfully
        - Partial read / some features unavailable
        - Failed before report generation
    validations:
      required: true
  - type: dropdown
    id: writes
    attributes:
      label: Were persistent writes attempted?
      options:
        - No
        - Yes, as an explicit maintainer-proposed opt-in test
        - Yes, independently
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional observations
      description: Include exact sanitized errors, firmware/transport observations, or differences from documented behavior.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach raw `probe --json`, unit IDs, serials, private fingerprints, raw sectors, or personal macro contents.
          required: true
